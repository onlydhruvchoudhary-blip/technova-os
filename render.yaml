services:
  - type: web
    name: technova-os
    runtime: docker
    dockerfilePath: ./technova-os/Dockerfile
    dockerContext: ./technova-os
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: TECHNOVA_ENVIRONMENT
        value: production
      - key: TECHNOVA_SECRET_KEY
        generateValue: true
      - key: TECHNOVA_QR_SECRET
        generateValue: true
      - key: TECHNOVA_DATABASE_URL
        fromDatabase:
          name: technova-db
          property: connectionString

databases:
  - name: technova-db
    plan: free
    databaseName: technova
    user: technova
