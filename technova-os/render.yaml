# Render.com blueprint — deploys TECHNOVA OS with a public URL.
# How to use: push this repo to GitHub, then on render.com choose
# "New +" → "Blueprint" and point it at your repo. Render reads this file.
services:
  - type: web
    name: technova-os
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: TECHNOVA_ENVIRONMENT
        value: production
      # Secrets are auto-generated by Render so you never handle them by hand.
      - key: TECHNOVA_SECRET_KEY
        generateValue: true
      - key: TECHNOVA_QR_SECRET
        generateValue: true
      # Uses the managed Postgres database defined below.
      - key: TECHNOVA_DATABASE_URL
        fromDatabase:
          name: technova-db
          property: connectionString

databases:
  - name: technova-db
    plan: free
    databaseName: technova
    user: technova
