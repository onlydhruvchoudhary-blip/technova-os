# TECHNOVA OS — production-style stack: Postgres + API (serving the built SPA).
# Usage:
#   1) cd frontend && npm ci && npm run build   # produces frontend/dist
#   2) cp -r frontend/dist backend/frontend_dist
#   3) docker compose up --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: technova
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: technova
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U technova"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TECHNOVA_ENVIRONMENT: production
      TECHNOVA_DATABASE_URL: postgresql+psycopg2://technova:${DB_PASSWORD:-changeme}@db:5432/technova
      TECHNOVA_SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      TECHNOVA_QR_SECRET: ${QR_SECRET:?set QR_SECRET in .env}
    ports:
      - "8000:8000"

  # Nightly database backup (pg_dump) into ./backups
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h db -U technova technova > /backups/technova-$$(date +%Y%m%d-%H%M%S).sql;
        find /backups -name "*.sql" -mtime +7 -delete;
        sleep 86400;
      done'

volumes:
  pgdata:
