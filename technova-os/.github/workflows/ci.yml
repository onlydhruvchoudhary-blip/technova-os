name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint, migrate, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: technova-os/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: technova-os/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app

      - name: Migrations apply cleanly (fresh DB)
        env:
          TECHNOVA_DATABASE_URL: sqlite:///./ci.db
          TECHNOVA_SECRET_KEY: ci-secret-key-0123456789abcdef
          TECHNOVA_QR_SECRET: ci-qr-secret-abcdef
        run: alembic upgrade head

      - name: Run tests
        env:
          TECHNOVA_SECRET_KEY: ci-secret-key-0123456789abcdef
          TECHNOVA_QR_SECRET: ci-qr-secret-abcdef
        run: python -m pytest -q

  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: technova-os/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: technova-os/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Build
        run: npm run build
