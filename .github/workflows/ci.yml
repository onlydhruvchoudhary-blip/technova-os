name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint, migrate, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: technova-os/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: technova-os/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app

      - name: Migrations apply cleanly (fresh DB)
        env:
          TECHNOVA_DATABASE_URL: sqlite:///./ci.db
          TECHNOVA_SECRET_KEY: ci-secret-key-0123456789abcdef
          TECHNOVA_QR_SECRET: ci-qr-secret-abcdef
        run: alembic upgrade head

      - name: Run tests
        env:
          TECHNOVA_SECRET_KEY: ci-secret-key-0123456789abcdef
          TECHNOVA_QR_SECRET: ci-qr-secret-abcdef
        run: python -m pytest -q

  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: technova-os/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: technova-os/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    # Only ship from main, and only after BOTH quality gates are green — never deploy a red build.
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not set — skipping deploy."
            echo "Add it under GitHub → Settings → Secrets and variables → Actions."
            echo "Get the URL from Render → your service → Settings → Deploy Hook."
            exit 0
          fi
          echo "CI passed — triggering Render deploy…"
          # Render's deploy hook returns 200 with a JSON body once the deploy is queued.
          http_code=$(curl -s -o /tmp/deploy.json -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          echo "Render responded: HTTP $http_code"
          cat /tmp/deploy.json || true
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Render deploy hook failed (HTTP $http_code)."
            exit 1
          fi
          echo "Deploy queued successfully. Track progress in the Render dashboard."
